<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram of files flowing through five type-matched scanner lanes into severity-labeled storage">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="0%" r="85%">
      <stop offset="0%" stop-color="#121a24"/>
      <stop offset="70%" stop-color="#0a0e14"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="640" height="360" fill="url(#bgGlow)"/>

  <!-- lanes -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" letter-spacing="1">
    <!-- text -->
    <rect x="150" y="34" width="320" height="34" rx="7" fill="#4c8dff" opacity="0.08" stroke="#4c8dff" stroke-opacity="0.3"/>
    <circle cx="185" cy="51" r="5" fill="#4c8dff"/>
    <circle cx="255" cy="51" r="5" fill="#4c8dff"/>
    <circle cx="330" cy="51" r="5" fill="#4c8dff"/>
    <circle cx="410" cy="51" r="5" fill="#4c8dff"/>

    <!-- sheet -->
    <rect x="150" y="90" width="320" height="34" rx="7" fill="#3fbf8f" opacity="0.08" stroke="#3fbf8f" stroke-opacity="0.3"/>
    <rect x="180" y="102" width="10" height="10" fill="#3fbf8f"/>
    <rect x="260" y="102" width="10" height="10" fill="#3fbf8f"/>
    <rect x="345" y="102" width="10" height="10" fill="#3fbf8f"/>
    <rect x="425" y="102" width="10" height="10" fill="#3fbf8f"/>

    <!-- image -->
    <rect x="150" y="146" width="320" height="34" rx="7" fill="#a47cf0" opacity="0.08" stroke="#a47cf0" stroke-opacity="0.3"/>
    <circle cx="190" cy="163" r="6" fill="#a47cf0"/>
    <circle cx="270" cy="163" r="6" fill="#a47cf0"/>
    <circle cx="355" cy="163" r="6" fill="#a47cf0"/>

    <!-- audio -->
    <rect x="150" y="202" width="320" height="34" rx="7" fill="#e570b0" opacity="0.08" stroke="#e570b0" stroke-opacity="0.3"/>
    <rect x="182" y="212" width="9" height="9" fill="#e570b0" transform="rotate(45 186.5 216.5)"/>
    <rect x="265" y="212" width="9" height="9" fill="#e570b0" transform="rotate(45 269.5 216.5)"/>
    <rect x="400" y="212" width="9" height="9" fill="#e570b0" transform="rotate(45 404.5 216.5)"/>

    <!-- video -->
    <rect x="150" y="258" width="320" height="34" rx="7" fill="#3fd1d9" opacity="0.08" stroke="#3fd1d9" stroke-opacity="0.3"/>
    <polygon points="182,269 182,281 194,275" fill="#3fd1d9"/>
    <polygon points="295,269 295,281 307,275" fill="#3fd1d9"/>
  </g>

  <!-- intake node -->
  <rect x="118" y="155" width="12" height="12" rx="2" fill="#4fa8ff" transform="rotate(45 124 161)"/>
  <line x1="60" y1="70" x2="118" y2="161" stroke="#4fa8ff" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="60" y1="290" x2="118" y2="161" stroke="#4fa8ff" stroke-opacity="0.25" stroke-width="1"/>

  <!-- converge node -->
  <rect x="504" y="155" width="12" height="12" rx="2" fill="#4fa8ff" transform="rotate(45 510 161)"/>

  <!-- sorted output grid -->
  <g>
    <rect x="546" y="60" width="72" height="240" rx="8" fill="#10161d" stroke="#232c38"/>
  </g>
  <g fill="#6b7684">
    <circle cx="562" cy="78" r="4"/><circle cx="578" cy="78" r="4" fill="#d9a441"/><circle cx="594" cy="78" r="4" fill="#6b7684"/><circle cx="610" cy="78" r="4" fill="#e0793c"/>
    <circle cx="562" cy="94" r="4" fill="#e23b3b"/><circle cx="578" cy="94" r="4" fill="#6b7684"/><circle cx="594" cy="94" r="4" fill="#d9a441"/><circle cx="610" cy="94" r="4" fill="#6b7684"/>
    <circle cx="562" cy="110" r="4" fill="#d9a441"/><circle cx="578" cy="110" r="4" fill="#e0793c"/><circle cx="594" cy="110" r="4" fill="#6b7684"/><circle cx="610" cy="110" r="4" fill="#d9a441"/>
    <circle cx="562" cy="126" r="4" fill="#6b7684"/><circle cx="578" cy="126" r="4" fill="#6b7684"/><circle cx="594" cy="126" r="4" fill="#e23b3b"/><circle cx="610" cy="126" r="4" fill="#6b7684"/>
    <circle cx="562" cy="142" r="4" fill="#e0793c"/><circle cx="578" cy="142" r="4" fill="#d9a441"/><circle cx="594" cy="142" r="4" fill="#6b7684"/><circle cx="610" cy="142" r="4" fill="#e0793c"/>
    <circle cx="562" cy="158" r="4" fill="#6b7684"/><circle cx="578" cy="158" r="4" fill="#e23b3b"/><circle cx="594" cy="158" r="4" fill="#d9a441"/><circle cx="610" cy="158" r="4" fill="#6b7684"/>
    <circle cx="562" cy="174" r="4" fill="#d9a441"/><circle cx="578" cy="174" r="4" fill="#6b7684"/><circle cx="594" cy="174" r="4" fill="#6b7684"/><circle cx="610" cy="174" r="4" fill="#d9a441"/>
    <circle cx="562" cy="190" r="4" fill="#6b7684"/><circle cx="578" cy="190" r="4" fill="#d9a441"/><circle cx="594" cy="190" r="4" fill="#e0793c"/><circle cx="610" cy="190" r="4" fill="#6b7684"/>
    <circle cx="562" cy="206" r="4" fill="#e0793c"/><circle cx="578" cy="206" r="4" fill="#6b7684"/><circle cx="594" cy="206" r="4" fill="#6b7684"/><circle cx="610" cy="206" r="4" fill="#e23b3b"/>
    <circle cx="562" cy="222" r="4" fill="#6b7684"/><circle cx="578" cy="222" r="4" fill="#e0793c"/><circle cx="594" cy="222" r="4" fill="#d9a441"/><circle cx="610" cy="222" r="4" fill="#6b7684"/>
    <circle cx="562" cy="238" r="4" fill="#d9a441"/><circle cx="578" cy="238" r="4" fill="#6b7684"/><circle cx="594" cy="238" r="4" fill="#6b7684"/><circle cx="610" cy="238" r="4" fill="#d9a441"/>
    <circle cx="562" cy="254" r="4" fill="#6b7684"/><circle cx="578" cy="254" r="4" fill="#d9a441"/><circle cx="594" cy="254" r="4" fill="#e23b3b"/><circle cx="610" cy="254" r="4" fill="#6b7684"/>
    <circle cx="562" cy="270" r="4" fill="#e0793c"/><circle cx="578" cy="270" r="4" fill="#6b7684"/><circle cx="594" cy="270" r="4" fill="#6b7684"/><circle cx="610" cy="270" r="4" fill="#e0793c"/>
    <circle cx="562" cy="286" r="4" fill="#6b7684"/><circle cx="578" cy="286" r="4" fill="#d9a441"/><circle cx="594" cy="286" r="4" fill="#6b7684"/><circle cx="610" cy="286" r="4" fill="#e23b3b"/>
  </g>

  <!-- flow lines from lanes to converge to output -->
  <g stroke="#4fa8ff" stroke-opacity="0.25" fill="none">
    <path d="M470 51 Q505 51 510 161"/>
    <path d="M470 107 Q505 107 510 161"/>
    <path d="M470 163 H510"/>
    <path d="M470 219 Q505 219 510 161"/>
    <path d="M470 275 Q505 275 510 161"/>
    <path d="M516 161 Q535 161 546 161"/>
  </g>

  <text x="150" y="24" fill="#8892a0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5">SOURCES → SCAN LANES → SEVERITY → SORTED STORAGE</text>
</svg>
